<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
 <script src="https://js.puter.com/v2/"></script>
<title>Nova AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;color:#202123;background:#fff;height:100vh;overflow:hidden}
.app{height:100vh;display:flex}.side{width:255px;background:#f7f7f8;border-right:1px solid #ddd;padding:14px;display:flex;flex-direction:column}.side-head{display:flex;align-items:center;justify-content:space-between}.close-side{display:none;border:0;background:transparent;font-size:26px;line-height:1;padding:5px;cursor:pointer}.overlay{display:none}
.logo{font-weight:700;font-size:21px;padding:8px 8px 18px}.new{border:1px solid #ddd;background:#fff;border-radius:9px;padding:11px;cursor:pointer;text-align:left;font-size:14px}
.history{margin-top:18px;flex:1;overflow:auto}.history h4{font-size:11px;color:#777;margin:8px}.item{padding:9px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.item:hover{background:#e9e9ea}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.bar{height:58px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 20px;font-weight:600}.hamb{display:none;margin-right:12px;border:0;background:none;font-size:22px}
.messages{flex:1;overflow:auto;padding:30px 16px}.wrap{max-width:850px;margin:auto}.msg{display:flex;gap:14px;margin:0 0 26px;line-height:1.6}.avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:#10a37f;color:#fff;font-weight:bold}.user .avatar{background:#222}
.content{white-space:pre-wrap;overflow-wrap:anywhere;flex:1}.welcome{text-align:center;padding-top:18vh}.welcome h1{font-size:34px;margin-bottom:8px}.welcome p{color:#777}.chips{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.chip{background:white;border:1px solid #ddd;border-radius:10px;padding:10px 13px;cursor:pointer}
.composer{padding:14px 16px 20px}.box{max-width:850px;margin:auto;border:1px solid #ccc;border-radius:15px;display:flex;padding:7px;box-shadow:0 2px 10px #0000000c}textarea{flex:1;border:0;outline:0;resize:none;padding:10px;font:inherit;max-height:150px}.send{width:42px;height:42px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer;align-self:end}.send:disabled{background:#aaa}
@media(max-width:700px){.side{position:fixed;z-index:20;top:0;bottom:0;left:0;width:min(280px,85vw);transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 24px #0002}.side.open{transform:translateX(0)}.close-side{display:block}.overlay{position:fixed;inset:0;z-index:10;background:#0006}.overlay.open{display:block}.hamb{display:block}.welcome h1{font-size:28px}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"><div class="side-head"><div class="logo">✦ Nova AI</div><button class="close-side" type="button" aria-label="Close sidebar" onclick="closeSidebar()">×</button></div><button class="new" onclick="newChat()">＋ New chat</button><div class="history"><h4>RECENT CHATS</h4><div id="history"></div></div><small>Powered by OpenAI</small></aside>
<div class="overlay" id="sidebarOverlay" onclick="closeSidebar()" aria-hidden="true"></div>
<main class="main">
<div class="bar"><button class="hamb" type="button" aria-label="Open sidebar" onclick="toggleSidebar()">☰</button>Nova AI</div>
<div class="messages"><div class="wrap" id="chat"></div></div>
<div class="composer"><div class="box"><textarea id="input" rows="1" placeholder="Message Nova AI..." onkeydown="keydown(event)"></textarea><button class="send" id="send" onclick="send()">↑</button></div></div>
</main></div>
<script>
const chat=document.getElementById("chat"), input=document.getElementById("input"), historyEl=document.getElementById("history"), side=document.getElementById("side"), sidebarOverlay=document.getElementById("sidebarOverlay");
function toggleSidebar(){side.classList.toggle("open");sidebarOverlay.classList.toggle("open")}
function closeSidebar(){side.classList.remove("open");sidebarOverlay.classList.remove("open")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSidebar()});
let messages=[], saved=JSON.parse(localStorage.getItem("novaChats")||"[]");
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){chat.innerHTML=messages.length?messages.map(m=>`<div class="msg ${m.role}"><div class="avatar">${m.role==="user"?"U":"✦"}</div><div class="content">${esc(m.content)}</div></div>`).join(""):`<div class="welcome"><h1>How can I help?</h1><p>Ask me anything.</p><div class="chips"><button class="chip" onclick="quick('Explain quantum computing simply')">Explain something</button><button class="chip" onclick="quick('Write a Python game')">Write code</button><button class="chip" onclick="quick('Give me a fun fact')">Fun fact</button></div></div>`;document.querySelector(".messages").scrollTop=999999}
function history(){historyEl.innerHTML=saved.slice().reverse().map((x,i)=>`<div class="item" onclick="load(${saved.length-1-i})">${esc(x.title)}</div>`).join("")}
function newChat(){messages=[];render();closeSidebar()}
function load(i){messages=saved[i].messages;render();closeSidebar()}
function quick(x){input.value=x;send()}
function keydown(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}}
async function send(){
 const text=input.value.trim();if(!text)return;
 messages.push({role:"user",content:text});input.value="";render();sendBtn(true);
 const t=document.createElement("div");t.className="msg assistant";t.id="typing";t.innerHTML='<div class="avatar">✦</div><div class="content">Thinking…</div>';chat.appendChild(t);document.querySelector(".messages").scrollTop=999999;
 try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
  const data=await r.json();if(!r.ok)throw new Error(data.error||"Request failed");
  document.getElementById("typing")?.remove();messages.push({role:"assistant",content:data.reply});render();store();
 }catch(e){document.getElementById("typing")?.remove();messages.push({role:"assistant",content:"⚠️ "+e.message});render()}
 sendBtn(false)
}
function sendBtn(disabled){document.getElementById("send").disabled=disabled}
function store(){if(!messages.length)return;const title=messages[0].content.slice(0,35);saved.push({title,messages});saved=saved.slice(-30);localStorage.setItem("novaChats",JSON.stringify(saved));history()}
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"});render();history();
</script>
</body>
</html>
